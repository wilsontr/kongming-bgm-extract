[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kongming-bgm"
version = "1.0.0"
description = "Decoder for the chunked PS-ADPCM BGM containers used in Koei PS2 titles"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Trevor Wilson" }]
keywords = ["ps2", "adpcm", "ps-adpcm", "bgm", "audio", "decoder", "game-audio"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kongming-bgm = "kongming_bgm.cli:main"

[project.urls]
Documentation = "https://github.com/wilsontr/kongming-bgm-extract/blob/main/FORMAT.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
